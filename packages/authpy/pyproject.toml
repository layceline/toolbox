[project]
name = "authpy"
version = "0.1.0"
description = "Auth helper to retrieve OAuth2 client-credentials tokens."
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.32",
    "typer>=0.12",
]

[project.scripts]
authpy = "authpy.cli:app"

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"
