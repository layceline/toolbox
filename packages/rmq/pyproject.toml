[project]
name = "rmq"
version = "0.1.0"
description = "RabbitMQ inspection and maintenance scripts."
requires-python = ">=3.14"
dependencies = [
    "pika>=1.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
rmq = "rmq.cli:app"

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"
